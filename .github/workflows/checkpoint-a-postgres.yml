name: Checkpoint A PostgreSQL gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-a-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ca_owner
          POSTGRES_PASSWORD: ca_disposable_only
          POSTGRES_DB: ca_checkpoint
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ca_owner -d ca_checkpoint"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://ca_owner:ca_disposable_only@127.0.0.1:5432/ca_checkpoint?application_name=ca_app&connection_limit=6
      DIRECT_URL: postgresql://ca_owner:ca_disposable_only@127.0.0.1:5432/ca_checkpoint
      CHECKPOINT_A_DISPOSABLE: "1"
      CHECKPOINT_DISABLE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma validate
      - name: Provision pre-existing T1B RLS spike role
        # migration 20260811112221_t1b_rls_spike_slice (baseline, predates
        # this Checkpoint A remediation) deliberately requires the
        # rls_spike_app role to already exist in the target database before
        # it applies — role/credential provisioning is kept out of the
        # Prisma migration history on purpose (see
        # scripts/rls-spike/setup-test-db.sh and
        # Docs/T1B_RLS_SPIKE_FINDINGS.md). This disposable CI database needs
        # the same out-of-band provisioning any other environment would.
        env:
          PGPASSWORD: ca_disposable_only
        run: |
          psql -h 127.0.0.1 -U ca_owner -d ca_checkpoint -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'rls_spike_app') THEN
                CREATE ROLE rls_spike_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'rls_spike_app_ci_disposable_only';
              END IF;
            END
            \$\$;
          "
      - name: Cumulative migration and no-op proof
        run: pnpm exec tsx tests/checkpoint-a/migrate.ts
      - name: Unit regression suite
        run: pnpm test --maxWorkers=2
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Real PostgreSQL concurrency and authorization
        run: pnpm exec vitest run --config vitest.checkpoint-a.config.mts --reporter=default --reporter=junit --outputFile.junit=artifacts/checkpoint-a/postgres-junit.xml
      - name: Preserve gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint-a-postgres-evidence
          path: artifacts/checkpoint-a/
          if-no-files-found: warn
